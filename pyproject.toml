[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mimikara"
version = "0.1.0"
description = "Subtitles where each English word appears as its Japanese counterpart is spoken."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fugashi>=1.3",
    "unidic-lite>=1.0.8",
    "jaconv>=0.3",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
cutlet = ["cutlet>=0.4"]
whisperx = ["whisperx>=3.1"]
dev = ["pytest>=7", "anthropic>=1.0"]

[project.scripts]
mimikara = "mimikara.cli:main"

[tool.setuptools.packages.find]
include = ["mimikara*"]

[tool.setuptools.package-data]
"mimikara.editor" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
